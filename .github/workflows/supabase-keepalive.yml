# Supabase 무료 프로젝트는 7일 동안 요청이 없으면 일시정지됨 → 3일마다 순위 함수를 한 번 호출 (조회만, 기록 안 남음)
name: Supabase keepalive
on:
  schedule:
    - cron: '17 3 */3 * *'   # UTC 03:17 = 한국 12:17, 3일마다
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (calc_dist)
        run: |
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X POST \
            "https://nrxpnhwbpculidkzhjcw.supabase.co/rest/v1/rpc/calc_dist" \
            -H "apikey: sb_publishable_X0RvjkuOwhaxJFXBRkJk8A_z3nSSVyV" \
            -H "Content-Type: application/json" \
            -d '{"q":{"mode":"moc","session_id":"keepalive","keys":[],"cycles":3}}')
          echo "HTTP $code"; head -c 200 /tmp/out.json; echo
          test "$code" = "200"
