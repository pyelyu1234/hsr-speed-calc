<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>속도 계산기 통계 (관리자)</title>
<style>
:root{--bg:#0f0d1a;--panel:#1a1730;--panel2:#231f3d;--line:#3a3560;--grid:#2b2748;
  --text:#ece9ff;--muted:#a29dc4;--accent:#c58bff;--accent2:#ff7ab8;--bar:#b07cf0;--bad:#ff8a8a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 12px 60px}
h1{font-size:17px;margin:0}
h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:15px;margin:0 0 10px}
.note{color:var(--muted);font-size:12px}
.err{color:var(--bad);font-size:13px;margin:6px 0 0}.err:empty{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;cursor:pointer}
.btn.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad);background:none}
.btn.sm{padding:5px 10px;font-size:12px}

/* 상단 고정 바 */
.top{position:sticky;top:0;z-index:5;background:rgba(15,13,26,.96);backdrop-filter:blur(6px);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.top .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.mtabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.mtab{background:none;border:none;color:var(--muted);font-size:15px;font-weight:700;padding:9px 6px;border-radius:9px;cursor:pointer}
.mtab.on{background:var(--accent);color:var(--bg)}
.mtab small{font-weight:600;opacity:.8}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{color:var(--text);border-color:var(--accent);background:rgba(197,139,255,.16);font-weight:700}
.stabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:8px;border-bottom:1px solid var(--line)}
.stab{background:none;border:none;color:var(--muted);font-size:14px;font-weight:700;padding:8px 2px;border-bottom:2px solid transparent;cursor:pointer;position:relative}
.stab.on{color:var(--text);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#1a0b0b;font-size:11px;font-weight:800;line-height:18px;margin-left:3px;vertical-align:1px}

/* 숫자 타일 */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .k{color:var(--muted);font-size:12px}
.tile .v{font-size:24px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.tile .s{color:var(--muted);font-size:11px}
.grid2{display:grid;grid-template-columns:1fr;gap:0 12px}
@media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}}

/* 가로 막대 */
.hb{display:grid;grid-template-columns:auto 1fr auto;gap:7px 10px;align-items:center}
.hb .lab{font-size:13px;white-space:nowrap}
.hb .track{height:12px;background:var(--grid);border-radius:4px;overflow:hidden}
.hb .fill{height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.hb .val{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.hb .val b{color:var(--text);font-size:13px}
/* 세로 막대 */
.vb{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);padding-top:16px}
.vb .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.vb .f{width:100%;max-width:26px;background:var(--bar);border-radius:4px 4px 0 0;min-height:1px}
.vb .n{font-size:11px;color:var(--text);margin-bottom:2px;font-variant-numeric:tabular-nums}
.vbx{display:flex;gap:3px;margin-top:4px}
.vbx span{flex:1;text-align:center;font-size:10px;color:var(--muted);min-width:0;white-space:nowrap}

/* 표 */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--grid);padding:9px 6px;text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#charCard{scroll-margin-top:190px}
tr.pick{cursor:pointer}
tr.pick.on td{background:rgba(197,139,255,.12)}
tr.pick.on td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

/* 목록 카드 */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .l1 .t{font-size:12px;color:var(--muted)}
.item .l1 .r{font-weight:700;white-space:nowrap}
.mem{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;margin-top:6px}
@media(min-width:720px){.mem{grid-template-columns:repeat(4,1fr)}}
.mem div{display:flex;justify-content:space-between;gap:6px;font-size:13px;min-width:0}
.mem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem .sp{font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap}
.mem .sp small{color:var(--muted)}
.item.rec{cursor:pointer}
.det{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.det b{color:var(--text);font-weight:600}
.item.party{cursor:pointer}.item.party.open{border-color:var(--accent)}
.mblk{padding:7px 0;border-bottom:1px solid var(--grid);font-size:12.5px}.mhd{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}.mhd>b{color:var(--text)}.mhd span{color:var(--muted)}.mhd span b{color:var(--text)}.mhd small{color:var(--muted)}
.mline{display:flex;gap:10px;color:var(--muted);line-height:1.6}.mline>span:first-child{flex:none;width:58px}.mline b{color:var(--text);font-weight:600}
.vrow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--grid);font-size:12px;color:var(--muted)}.vrow b{color:var(--text);font-weight:600}
.dsec{margin:10px 0 4px;font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.3px}.dsec:first-child{margin-top:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid var(--grid);font-size:12.5px}.kv span{color:var(--muted);white-space:nowrap}.kv b{color:var(--text);font-weight:600;text-align:right}
.cset{padding:5px 0;border-bottom:1px solid var(--grid);font-size:12.5px;line-height:1.45}.cset b{color:var(--text);margin-right:6px}.cset span{color:var(--muted)}
.delrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rank{display:inline-block;min-width:26px;color:var(--accent);font-weight:800}
.why{color:var(--bad);font-size:12px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:13px;z-index:20}
.opt{display:flex;flex-direction:column;gap:10px}
.opt label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.opt input{margin-top:3px}
</style>
</head>
<body>
<div class="wrap">
  <!-- 로그인 -->
  <div class="card" id="loginCard" style="margin-top:20px">
    <h1 style="margin-bottom:10px"><span>속도 계산기</span> 통계</h1>
    <form id="loginForm" class="row" autocomplete="on">
      <input type="email" id="em" placeholder="이메일" required autocomplete="username" style="flex:1;min-width:180px">
      <input type="password" id="pw" placeholder="비밀번호" required autocomplete="current-password" style="flex:1;min-width:140px">
      <button class="btn on" type="submit">로그인</button>
    </form>
    <p class="err" id="loginErr"></p>
    <p class="note">주인님 전용이에요. Supabase에서 만든 계정으로 로그인해요.</p>
  </div>

  <div id="dash" hidden>
    <div class="top">
      <div class="hd">
        <h1><span>속도 계산기</span> 통계</h1>
        <div class="row" style="gap:6px"><span class="note" id="loadedAt"></span><button class="btn sm" id="reload">새로고침</button></div>
      </div>
      <div class="mtabs" id="mTabs">
        <button class="mtab on" data-v="moc">혼돈 <small data-c="moc"></small></button>
        <button class="mtab" data-v="aa">이상중재 <small data-c="aa"></small></button>
      </div>
      <div class="chips" id="fPeriod">
        <button class="chip on" data-v="all">전체 기간</button><button class="chip" data-v="1">오늘</button><button class="chip" data-v="7">7일</button><button class="chip" data-v="30">30일</button>
      </div>
      <div class="stabs" id="sTabs">
        <button class="stab on" data-v="sum">요약</button><button class="stab" data-v="char">캐릭터</button><button class="stab" data-v="party">파티</button><button class="stab" data-v="rec">기록<span class="badge" id="susBadge" hidden></span></button>
      </div>
    </div>
    <p class="err" id="dashErr"></p>

    <!-- 요약 -->
    <section data-sec="sum">
      <div class="tiles" id="tiles"></div>
      <div class="card">
        <h2>일별 기록 <span class="note">최근 14일</span></h2>
        <div id="daily"></div>
      </div>
      <div class="grid2">
        <div class="card">
          <h2>캐릭터 사용률</h2>
          <div id="usage"></div>
        </div>
        <div class="card">
          <h2>아하 타임 횟수</h2>
          <div id="ahaDist"></div>
          <p class="note" id="ahaNote" style="margin:8px 0 0"></p>
        </div>
      </div>
      <div class="card">
        <h2>함께 쓴 서포터</h2>
        <div id="supUse"></div>
      </div>
    </section>

    <!-- 캐릭터 -->
    <section data-sec="char" hidden>
      <div class="card">
        <h2>캐릭터 한눈에 <span class="note">행을 누르면 아래에 상세</span></h2>
        <table id="charTable"></table>
      </div>
      <div class="card" id="charCard">
        <h2 id="charTitle"></h2>
        <div class="tiles" id="charTiles" style="margin:0 0 14px"></div>
        <div class="grid2">
          <div style="margin-bottom:14px"><p class="note" style="margin:0 0 4px">속도 분포 (5 단위)</p><div id="spdHist"></div></div>
          <div style="margin-bottom:14px"><p class="note" style="margin:0 0 6px">성혼</p><div id="eidDist"></div></div>
        </div>
        <p class="note" style="margin:0 0 6px">장신구 · 유물</p><div id="relDist"></div>
      </div>
    </section>

    <!-- 파티 -->
    <section data-sec="party" hidden>
      <div class="card">
        <h2>파티 조합 <span class="note">이름 옆 숫자는 평균 속도 · 누르면 상세 통계</span></h2>
        <div class="list" id="combos"></div>
        <div class="row" style="margin-top:10px"><button class="btn" id="pMore">더 보기</button><span class="note" id="pInfo"></span></div>
      </div>
    </section>

    <!-- 기록 -->
    <section data-sec="rec" hidden>
      <div class="card" id="susCard">
        <h2>의심 기록 <span class="note">전체 콘텐츠</span></h2>
        <p class="note" style="margin:-4px 0 10px">속도가 비었거나 50 미만 · 400 초과, 파티가 비었거나 결과가 없는 기록이에요.</p>
        <div id="sus"></div>
      </div>
      <div class="card">
        <h2>최근 기록 <span class="note">누르면 상세 · 삭제</span></h2>
        <div id="recFilter" style="margin:-4px 0 10px"></div>
        <div class="list" id="recent"></div>
        <div class="row" style="margin-top:10px"><button class="btn" id="more">더 보기</button><span class="note" id="recentInfo"></span></div>
      </div>
      <div class="card">
        <h2>설정</h2>
        <div class="opt">
          <label><input type="checkbox" id="allRec"><span>중복 포함해서 보기<br><span class="note">기본은 한 사람(브라우저)당 콘텐츠별 최신 1건이에요. 켜면 방문마다 1건씩 모두 세요.</span></span></label>
          <label><input type="checkbox" id="exMine"><span>이 기기의 계산기 사용은 수집 안 함<br><span class="note">내 테스트가 통계에 섞이지 않게 해요.</span></span></label>
        </div>
        <div class="delrow"><button class="btn" id="logout">로그아웃</button></div>
      </div>
    </section>
  </div>
</div>

<script>
const SB={url:'https://nrxpnhwbpculidkzhjcw.supabase.co',key:'sb_publishable_X0RvjkuOwhaxJFXBRkJk8A_z3nSSVyV',table:'calc_logs'};
const MODE_NAME={moc:'혼돈',aa:'이상중재'};
const SHORT={aeon_aha:'에이언즈 아하',pearl:'펄',waven:'웨이브',evanescia:'에바네시아',silverwolf999:'은랑',trailblazer:'환척자',sparxie:'스파키',yaoguang:'효광'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kstDay=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(d);
const kstTime=d=>new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
const r1=x=>Math.round(x*10)/10;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
const pct=(a,b)=>b?Math.round(a/b*100):0;
const median=a=>{if(!a.length)return NaN;const s=a.slice().sort((x,y)=>x-y),h=s.length>>1;return s.length%2?s[h]:(s[h-1]+s[h])/2;};
const isNum=v=>typeof v==='number'&&isFinite(v);

/* ── 인증 ── */
let AUTH=null;
function saveAuth(a){AUTH=a;try{a?localStorage.setItem('hsrAdminAuth',JSON.stringify(a)):localStorage.removeItem('hsrAdminAuth');}catch(e){}}
async function authCall(grant,body){
  const r=await fetch(SB.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||('HTTP '+r.status));
  return {access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,email:(j.user||{}).email};
}
async function token(){
  if(!AUTH)throw new Error('login');
  if(Date.now()>AUTH.exp-60000){try{saveAuth(await authCall('refresh_token',{refresh_token:AUTH.refresh}));}catch(e){saveAuth(null);throw new Error('login');}}
  return AUTH.access;
}
async function fetchAll(){
  const out=[];const step=1000;
  for(let from=0;from<50000;from+=step){
    const t=await token();
    const r=await fetch(`${SB.url}/rest/v1/${SB.table}?select=*&order=created_at.desc`,{headers:{apikey:SB.key,Authorization:'Bearer '+t,Range:`${from}-${from+step-1}`,'Range-Unit':'items'}});
    if(r.status===401){saveAuth(null);throw new Error('login');}
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||('HTTP '+r.status));}
    const rows=await r.json();out.push(...rows);if(rows.length<step)break;
  }
  return out;
}

/* ── 데이터 ── */
let RAW=[],ALL=[],F={period:'all',mode:'moc',all:false,sec:'sum',ch:null,party:null},partyN=10,openParty=null,recentN=20,openRec=null;
function prep(rows,all){
  // 기본: 한 사람(session_id)당 콘텐츠별 최신 1건 · 중복 포함: 방문당 최신 1건
  const seen=new Set(),out=[];
  rows.forEach(r=>{const k=all?(r.visit_id?'v:'+r.visit_id:null):(r.session_id?'s:'+r.session_id+'|'+r.mode:null);
    if(k){if(seen.has(k))return;seen.add(k);}
    r._d=new Date(r.created_at);r._party=(Array.isArray(r.party)?r.party:[]).filter(p=>p&&typeof p==='object');r._res=r.results||{};r._set=r.settings||{};out.push(r);});
  return out;
}
function filtered(){
  const now=Date.now(),today=kstDay(new Date());
  return ALL.filter(r=>{
    if(r.mode!==F.mode)return false;
    if(F.period==='1')return kstDay(r._d)===today;
    if(F.period!=='all')return now-r._d.getTime()<=(+F.period)*86400000;
    return true;});
}
const cid=p=>p.key&&p.key!=='custom'?p.key:'n:'+(p.name||'?');
const cname=id=>id.startsWith('n:')?id.slice(2):(SHORT[id]||id);
const cyc=r=>Math.max(1,Math.round(+r._set.cycles)||3);
const LCR=l=>+l>1?'전광 '+l+'재':'전광 착용'; // 1재는 '전광 착용'
const lcTxt=p=>(p.key==='aeon_aha'||p.key==='silverwolf999')?(+p.lc>0?' · '+LCR(p.lc):' · 전광 미착용'):(+p.lc>0?' · 전광 착용':' · 전광 미착용');
function mainCycle(rows){const c={};rows.forEach(r=>{if(isNum(r._res.aha))c[cyc(r)]=(c[cyc(r)]||0)+1;});const e=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return e?+e[0]:3;}

/* ── 그리기 ── */
function hbars(el,items,{max,fmt}={}){
  if(!items.length){el.innerHTML='<p class="note" style="margin:0">데이터 없음</p>';return;}
  const m=max||Math.max(...items.map(i=>i.v))||1;
  el.innerHTML='<div class="hb">'+items.map(i=>`<div class="lab">${esc(i.label)}</div><div class="track"><div class="fill" style="width:${Math.max(0.5,i.v/m*100)}%"></div></div><div class="val">${fmt?fmt(i):'<b>'+i.v+'</b>'}</div>`).join('')+'</div>';
}
function vbars(el,items,{labelEvery=1}={}){
  if(!items.length||!items.some(i=>i.v)){el.innerHTML='<p class="note" style="margin:0">데이터 없음</p>';return;}
  const m=Math.max(...items.map(i=>i.v))||1;
  el.innerHTML='<div class="vb">'+items.map(i=>`<div class="c" title="${esc(i.label+': '+i.v)}">${i.v?`<span class="n">${i.v}</span>`:''}<div class="f" style="height:${i.v/m*100}%"></div></div>`).join('')+'</div>'
    +'<div class="vbx">'+items.map((i,k)=>`<span>${k%labelEvery===0?esc(i.short||i.label):''}</span>`).join('')+'</div>';
}
const tile=(k,v,s)=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
const memHtml=list=>`<div class="mem">${list.map(m=>`<div><span class="nm">${esc(m.n==='에이언즈 아하'?'에이언즈':m.n)}</span><span class="sp">${m.s}</span></div>`).join('')}</div>`;

/* ── 렌더 ── */
function render(){
  document.querySelectorAll('#mTabs small').forEach(el=>{el.textContent=ALL.filter(r=>r.mode===el.dataset.c).length;});
  const susN=RAW.filter(r=>susReason(r).length).length;

const pkey=r=>r._party.map(cid).sort().join('|');

  const ent=distTxt(rs.map(r=>{if(r._set.entry==null)return '정보 없음 (예전 기록)';const p=r._party.find(p=>+p.slot===+r._set.entry+1)||r._party[+r._set.entry];return p?cname(cid(p)):'정보 없음 (예전 기록)';}));

function detHtml(r){

}

/* ── 오염 기록 삭제 ── */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
async function delWhere(q,label){
  if(!confirm(label+'\n\n지운 기록은 되돌릴 수 없어요. 삭제할까요?'))return 0;
  let tk;try{tk=await token();}catch(e){showLogin('로그인이 만료됐어요. 다시 로그인해 주세요.');return 0;}
  const r=await fetch(`${SB.url}/rest/v1/${SB.table}?${q}`,{method:'DELETE',headers:{apikey:SB.key,Authorization:'Bearer '+tk,Prefer:'return=representation'}});
  if(!r.ok){toast('삭제 실패: HTTP '+r.status);return 0;}
  const del=await r.json().catch(()=>[]);
  if(!del.length){toast('지워진 기록이 없어요. 삭제 권한 SQL을 실행했는지 확인해 주세요.');return 0;}
  const ids=new Set(del.map(x=>x.id));RAW=RAW.filter(x=>!ids.has(x.id));ALL=prep(RAW,F.all);openRec=null;render();toast(del.length+'건 삭제했어요');return del.length;
}
function susReason(r){const p=Array.isArray(r.party)?r.party:[];const why=[];
  if(!p.length)why.push('파티 없음');
  p.forEach(x=>{x=x||{};const v=x.spd,nm=SHORT[x.key]||x.name||x.key||'?';if(!isNum(v))why.push(`${nm} 속도 없음`);else if(v<50||v>400)why.push(`${nm} 속도 ${v}`);});
  const res=r.results||{};if(!isNum(res.aha))why.push('결과 없음');
  return why;}
function renderSus(){
  const list=RAW.map(r=>({r,why:susReason(r)})).filter(x=>x.why.length);
  if(!list.length){$('sus').innerHTML='<p class="note" style="margin:0">의심 기록이 없어요.</p>';return;}
  $('sus').innerHTML=`<div class="list">${list.slice(0,100).map(({r,why})=>`<div class="item"><div class="l1"><span class="t">${kstTime(new Date(r.created_at))} · ${esc(MODE_NAME[r.mode]||r.mode||'-')}</span><button class="btn danger sm" data-delid="${r.id}">삭제</button></div><div class="why">${esc(why.slice(0,3).join(' · '))}</div></div>`).join('')}</div>
    <div class="delrow"><button class="btn danger" id="delAllSus">의심 기록 ${list.length}건 모두 삭제</button></div>`;
  $('sus').querySelectorAll('[data-delid]').forEach(b=>b.onclick=()=>delWhere('id=eq.'+b.dataset.delid,'이 기록 1건을 삭제해요.'));
  $('delAllSus').onclick=()=>delWhere('id=in.('+list.map(x=>x.r.id).join(',')+')',`의심 기록 ${list.length}건을 모두 삭제해요.`);
}

/* ── 이벤트 ── */
function tabs(sel,cls,key,after){document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{F[key]=b.dataset.v;document.querySelectorAll(sel).forEach(x=>x.classList.toggle(cls,x===b));if(after)after();render();});}
tabs('#fPeriod .chip','on','period',()=>{recentN=20;});
tabs('#mTabs .mtab','on','mode',()=>{recentN=20;F.ch=null;F.party=null;openParty=null;partyN=10;});
tabs('#sTabs .stab','on','sec',()=>scrollTo({top:0}));
$('pMore').onclick=()=>{partyN+=10;renderParty();};
$('allRec').onchange=e=>{F.all=e.target.checked;ALL=prep(RAW,F.all);recentN=20;render();};
$('more').onclick=()=>{recentN+=30;renderRec();};
try{$('exMine').checked=localStorage.getItem('hsrOptOut')==='1';}catch(e){}
$('exMine').onchange=e=>{try{localStorage.setItem('hsrOptOut',e.target.checked?'1':'0');}catch(_){}};

function showLogin(msg){$('dash').hidden=true;$('loginCard').hidden=false;$('loginErr').textContent=msg||'';}
async function load(){
  $('dashErr').textContent='';$('reload').disabled=true;$('reload').textContent='불러오는 중…';
  try{
    RAW=await fetchAll();ALL=prep(RAW,F.all);
    $('loginCard').hidden=true;$('dash').hidden=false;
    $('loadedAt').textContent=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())+' 기준';
    if(!ALL.length)$('dashErr').textContent='데이터가 0건이에요. 아직 기록이 없거나, SQL의 읽기 권한 이메일이 로그인한 이메일과 다를 수 있어요.';
    render();
  }catch(e){
    if(e.message==='login')showLogin(AUTH?'':'로그인이 만료됐어요. 다시 로그인해 주세요.');
    else{$('loginCard').hidden=true;$('dash').hidden=false;$('dashErr').textContent='불러오기 실패: '+e.message;}
  }finally{$('reload').disabled=false;$('reload').textContent='새로고침';}
}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginErr').textContent='로그인 중…';
  try{saveAuth(await authCall('password',{email:$('em').value.trim(),password:$('pw').value}));$('pw').value='';$('loginErr').textContent='';load();}
  catch(err){$('loginErr').textContent=/invalid/i.test(err.message)?'이메일 또는 비밀번호가 틀렸어요.':/confirm/i.test(err.message)?'이메일 인증이 안 된 계정이에요. 계정 만들 때 Auto Confirm을 켜 주세요.':'로그인 실패: '+err.message;}};
$('reload').onclick=load;
$('logout').onclick=()=>{saveAuth(null);showLogin('로그아웃했어요.');};

try{AUTH=JSON.parse(localStorage.getItem('hsrAdminAuth')||'null');}catch(e){}
if(AUTH)load();else showLogin('');
</script>
